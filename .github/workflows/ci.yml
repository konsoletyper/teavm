name: Build
on:
  pull_request:
  push:
    branches:
      - master
      - 'release-**'
      - 'check-**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
        - c
        - js
        - wasm-gc
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: temurin
    - uses: actions/setup-node@v7
      with:
        node-version: 26
    - uses: gradle/actions/setup-gradle@v5
    - run: |
        platforms=("c" "js" "wasm-gc")
        args=()
        for v in "${platforms[@]}"
        do
          if [[ "${{ matrix.platform }}" != "$v" ]]; then
            args+=("-Pteavm.tests.${v}=false")
          fi
        done
        args+=("-Pteavm.localNodeJS=true")
        args+=("-Pteavm.tests.c.runWrapper=")
        args+=("-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m")
        echo "${args[@]}"
        export TEAVM_TEST_BROWSER_LOG=1
        ./gradlew "${args[@]}" --stacktrace test
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: "test-reports-${{ matrix.platform }}"
        path: |
          tests/build/reports/tests/test
          tests/build/teavm-tests/browser-stderr-*.txt
          tests/build/teavm-tests/browser-stdout-*.txt
  checkstyle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
      - run: |
          args=()
          args+=("-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m")
          ./gradlew "${args[@]}" check -x test