name: Verified Unciv source release
on:
  push:
    branches: ["codex/unciv-teavm-0.16"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-and-release:
    if: github.repository_owner == 'YosefLm'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Verify source
        run: gradle :core:test :core:relocateJar :classlib:relocateJar :jso:apis:relocateJar --no-daemon --console=plain
      - name: Package exact source and built Java archives
        shell: bash
        run: |
          mkdir -p release
          git archive --format=tar --prefix=source/ HEAD | gzip -n > release/source.tar.gz
          git rev-parse HEAD > release/SOURCE_COMMIT
          find . -path '*/build/libs/*.jar' -type f -print0 | tar --null -T - -czf release/built-jars.tar.gz
          (cd release && sha256sum source.tar.gz built-jars.tar.gz > SHA256SUMS)
      - name: Publish immutable commit release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          tag="unciv-${SOURCE_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace immutable assets."
            exit 0
          fi
          gh release create "$tag" release/* --target "$SOURCE_SHA" --prerelease --title "Unciv fork ${SOURCE_SHA}" --notes "Verified source archive for this exact commit. SHA256SUMS and SOURCE_COMMIT identify the inputs. Built jars are diagnostic outputs, not a Maven repository."
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-reports
          path: '**/build/reports/'
