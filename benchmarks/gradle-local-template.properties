# Settings of benchmarks that measure performance of code produced by TeaVM (see README.md).
#
# HOW TO USE
#
# Copy this file to gradle-local.properties in the same directory (it's ignored by git), then uncomment
# and edit properties you want to change. Commented out values are examples, not defaults.
# Then run one of the tasks:
#
#   ./gradlew :benchmarks:teavmBenchmark  - compile benchmarks with TeaVM and run them
#   ./gradlew :benchmarks:jmh             - run the same benchmarks on JVM with JMH
#
# or one of compare-stash.sh/compare-commit.sh scripts, which pick these settings up as well.
#
# Values from gradle-local.properties take priority over gradle.properties, but -P options from
# command line take priority over gradle-local.properties. Empty value (name=) is the same as not
# setting property at all.
#
# Reports: build/reports/teavm-perf (report.html, report.txt, report.md, results-<backend>.json).


# ----- Selecting benchmarks (both teavmBenchmark and jmh) -----

# Comma-separated list of regular expressions. Benchmark runs when any of them matches any part
# of its fully qualified name (package.Class.method). By default, all benchmarks run.
#benchmark.include=StringSplit,Pi

# Comma-separated list of regular expressions of benchmarks to exclude.
#benchmark.exclude=StringBuilder

# Override values of @Param fields. Format: name=value1,value2;name2=value1,...
# See @Param fields of benchmark classes for available parameters.
#benchmark.params=digits=100;kind=random


# ----- Iterations (both teavmBenchmark and jmh) -----
# Defaults are taken from @Warmup, @Measurement and @Fork annotations of benchmark class.
# Without annotations, teavmBenchmark runs 3 warmup x 300ms, 5 measurement x 500ms, 1 fork
# (JMH on JVM has its own defaults: 5 x 10s, 5 x 10s, 5 forks).

# Number of warmup iterations
#benchmark.warmupIterations=2

# Duration of each warmup iteration, e.g. 500ms, 1s
#benchmark.warmupTime=500ms

# Number of measurement iterations
#benchmark.iterations=3

# Duration of each measurement iteration, e.g. 500ms, 1s
#benchmark.time=1s

# Number of forks. In browser every fork runs in a new frame, for C in a new process.
#benchmark.forks=2

# Benchmark mode: thrpt (throughput, default), avgt (average time), ss (single shot), all.
#benchmark.mode=avgt

# Time unit: ns, us, ms, s, m. Default is s.
#benchmark.timeUnit=us


# ----- Backends (teavmBenchmark only) -----

# Comma-separated list of: js, wasm-gc, c. Default is js.
#benchmark.backends=js,wasm-gc,c

# Browser for js and wasm-gc: browser-chrome (default), browser-firefox, or browser (prints URL
# to open manually).
#benchmark.browser=browser-firefox

# TeaVM optimization level: simple, advanced (default), full.
#benchmark.optimization=full

# Script that compiles generated C code. Default depends on OS: compile-c-unix.sh (gcc -O2),
# compile-c-macos.sh (clang -O2), compile-c-windows.bat (MSVC).
#benchmark.c.compiler=my-compile-c.sh

# Script that sets up C compiler environment. Default is setup-msvc-env.bat on Windows (unless
# benchmark.c.compiler is set), nothing otherwise.
#benchmark.c.envScript=my-env.bat


# ----- Reports and comparison (teavmBenchmark only) -----

# Comma-separated list of report formats: text, json, html, markdown. Default is text,json,html,markdown.
#benchmark.formats=text,html

# Run benchmarks on JVM with JMH first and include its results into report.
#benchmark.compareJvm=true

# Comma-separated list of JMH JSON files to compare with, optionally labeled: label=file.json.
# Differences that are not statistically significant (Welch's t-test, p >= 0.01) are marked as such.
# Bytes allocated per operation (gc.alloc.rate.norm, produced by JMH with -prof gc) are compared as well.
# Don't set it when using compare-*.sh scripts, they pass baseline themselves.
#benchmark.baseline=old=build/old-results.json


# ----- Profiling (teavmBenchmark only) -----

# Only cpu is supported: records CPU profile of measurement iterations for js and wasm-gc in Chrome
# to build/reports/teavm-perf/profiles/<backend>/<benchmark>.cpuprofile. Don't compare scores
# of runs with and without profiling.
#benchmark.profiler=cpu


# ----- Everything else -----

# Raw JMH-style arguments, separated by whitespace, for options not covered above,
# e.g. -opi (operations per invocation), -bs/-wbs (batch sizes).
#benchmark.extraArgs=-opi 10
