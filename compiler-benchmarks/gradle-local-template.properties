# Settings of compiler benchmarks (performance of TeaVM compiler itself, measured by JMH on JVM).
#
# HOW TO USE
#
# Copy this file to gradle-local.properties in the same directory (it's ignored by git), then uncomment
# and edit properties you want to change. Commented out values are examples, not defaults.
# Then run one of the tasks:
#
#   ./gradlew :compiler-benchmarks:jmh         - run benchmarks
#   ./gradlew :compiler-benchmarks:jmhList     - list selected benchmarks and their parameters
#   ./gradlew :compiler-benchmarks:jmhCompare  - compare results of the last run with benchmark.baseline again
#
# Values from gradle-local.properties take priority over gradle.properties, but -P options from
# command line take priority over gradle-local.properties. Empty value (name=) is the same as not
# setting property at all.
#
# Results of the last run: build/reports/jmh/results.json (JMH JSON format).
#
# COMPARING WITH BASELINE
#
# 1. Check out the code you want to compare against (e.g. master), set benchmark.saveBaseline=master
#    and run :compiler-benchmarks:jmh. Results are stored to build/baselines/master.json.
# 2. Check out your changes, comment out benchmark.saveBaseline, set benchmark.baseline=master
#    and run :compiler-benchmarks:jmh again. After benchmarks finish, comparison table is printed and written
#    to build/reports/jmh/comparison.{txt,md,html}. Differences that are not statistically significant
#    (Welch's t-test on per-iteration scores, p >= 0.01) are marked as such.
# Use the same settings for both runs. Note that `./gradlew clean` removes saved baselines.


# ----- Selecting benchmarks -----

# Comma-separated list of regular expressions. Benchmark runs when any of them matches any part
# of its fully qualified name (package.Class.method). By default, all benchmarks run.
# Available benchmarks: WasmGCCompilerBenchmark.bufferedInputStream (small program),
# BootstrapCompilerBenchmark.bootstrapCompiler (TeaVM compiler itself, mid-sized real-life program).
#benchmark.include=WasmGCCompilerBenchmark

# Comma-separated list of regular expressions of benchmarks to exclude.
#benchmark.exclude=Bootstrap

# Override values of @Param fields. Format: name=value1,value2;name2=value1,...
# Parameters:
#   optimization        - SIMPLE, ADVANCED, FULL (both benchmarks; default ADVANCED)
#   reuseParsedClasses  - true, false (BootstrapCompilerBenchmark only; default false). When true,
#                         class parsing is excluded from measurement.
#benchmark.params=optimization=SIMPLE,ADVANCED;reuseParsedClasses=true


# ----- Iterations -----
# Defaults are taken from @Warmup, @Measurement and @Fork annotations of each benchmark class:
#   WasmGCCompilerBenchmark:    10 warmup x 3s, 10 measurement x 3s, 1 fork
#   BootstrapCompilerBenchmark: 2 warmup x 10s, 5 measurement x 10s, 1 fork

# Number of warmup iterations
#benchmark.warmupIterations=5

# Duration of each warmup iteration, e.g. 500ms, 3s
#benchmark.warmupTime=3s

# Number of measurement iterations
#benchmark.iterations=10

# Duration of each measurement iteration, e.g. 500ms, 3s
#benchmark.time=3s

# Number of forks, i.e. how many times to run each benchmark in a fresh JVM. More forks give more
# reliable results, since JIT decisions differ from run to run. 3 is a good value for comparison runs.
#benchmark.forks=3


# ----- Output -----

# Benchmark mode: avgt (average time per operation), thrpt (throughput), ss (single shot), all.
# Default is avgt.
#benchmark.mode=avgt

# Time unit: ns, us, ms, s, m. Default is ms.
#benchmark.timeUnit=ms


# ----- Baselines -----

# Save results of this run as baseline with given name (build/baselines/<name>.json)
#benchmark.saveBaseline=master

# Compare results of this run with baseline: either name of baseline saved by benchmark.saveBaseline,
# or path to JMH JSON file (must end with .json). Reports compare time per operation and,
# when benchmark.gc is on in both runs, bytes allocated per operation.
#benchmark.baseline=master


# ----- Profiling and JVM -----

# Measure memory allocation (JMH -prof gc). Adds bytes per operation to results and comparison table.
#benchmark.gc=true

# Record JFR profile of measurement iterations to build/reports/jmh/profile/<benchmark>-<params>/profile.jfr.
# Open it with IDEA (Run | Open Profiler Snapshot) or JDK Mission Control. Don't compare scores
# of runs with and without profiling.
#benchmark.profile=true

# Additional arguments of forked JVM. Default heap is -Xmx4g (set by @Fork annotation).
#benchmark.jvmArgs=-Xmx8g -XX:+UseParallelGC


# ----- Everything else -----

# Raw JMH arguments, separated by whitespace, for options not covered above.
# Run `java -cp <classpath> org.openjdk.jmh.Main -h` for the full list.
#benchmark.extraArgs=-prof stack
